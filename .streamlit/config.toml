[theme]
primaryColor = "#0a3a4f"
backgroundColor = "#f2f9ff"
secondaryBackgroundColor = "#ffffff"
textColor = "#07161f"
font = "sans serif"

[server]
headless = true
maxUploadSize = 50          # MB; matches the app's own zip limit (custom.MAX_ZIP_MB)

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"       # no Deploy button or developer menu for visitors

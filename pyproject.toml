[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tallyhound"
version = "0.6.1"
description = "Finance audit console: AI agents and rules propose findings, a person decides."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Aleks Arriola" }]
requires-python = ">=3.10"
dependencies = ["streamlit>=1.55", "pandas", "altair", "openpyxl", "reportlab", "pypdf"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/aleksarriola-max/Tallyhound"
Demo = "https://tallyhound-kfzkutbxmxdsrynlmppoll.streamlit.app/"

[tool.setuptools]
packages = ["tallyhound"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B", "PLE"]
ignore = ["B008", "B905"]
